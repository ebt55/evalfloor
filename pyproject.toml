[project]
name = "eval-floor"
version = "0.1.0"
description = "What score does an answer with no content in it already get on each Inspect Evals task?"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ebin Babu Thomas" }]
keywords = ["evaluation", "inspect-ai", "scorers", "benchmark-validity"]

# Both pins are load-bearing. inspect_evals 0.20.0 is the newest release in which
# src/inspect_evals/paws/paws.py still carries `scorer=includes()`; PR #2334 changes
# that line and is not in any release as of 2026-09-15. See NOTES.md.
dependencies = [
    "inspect_ai==0.3.263",
    "inspect_evals==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

# The model-graded arm only. Inspect declares provider SDKs as optional, so
# without these a graded task raises PrerequisiteError instead of grading -- and
# the harness records that as an error, never as a score of zero. The
# deterministic arm never needs them: it calls no model at all.
graded = [
    "anthropic>=0.40",
    "openai>=1.60",
]

[project.scripts]
evalfloor = "evalfloor.cli:main"

# Registers evalfloor as an Inspect extension package, so the control tasks
# committed in this repository are addressable as `evalfloor/control_loose`
# rather than a bare `control_loose` that could collide with anything.
[project.entry-points.inspect_ai]
evalfloor = "evalfloor.controls"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalfloor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "dataset: downloads a dataset from Hugging Face (slow, needs network)",
]
